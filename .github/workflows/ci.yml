name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # G4: este runner não tem GPU/driver Vulkan. VulkanRendererSmokeTest captura a falha de
      # inicialização (VulkanUnavailableException, incluindo LinkageError se libvulkan.so.1
      # nem existir) e pula via Assumptions — os testes de gráfico "de verdade" rodam contra
      # RecordingRenderer (RFC-N3DSEMU D4).
      - name: mvn test
        run: mvn --batch-mode --no-transfer-progress test

      - name: Publica os relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
